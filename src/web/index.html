<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111613">
  <title>Linux Kernel Monitoring System</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="Linux Kernel Monitor home">
        <span class="brand-mark">LK</span>
        <span><strong>Kernel Monitor</strong><small>LINUX SYSTEMS LAB</small></span>
      </a>
      <div class="nav-caption">MONITOR</div>
      <nav aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-index">01</span>Dashboard</button>
        <button class="nav-item" data-view="processes"><span class="nav-index">02</span>Live processes</button>
        <button class="nav-item" data-view="process-detail"><span class="nav-index">03</span>Process details</button>
        <button class="nav-item" data-view="tree"><span class="nav-index">04</span>Process tree</button>
        <button class="nav-item" data-view="cpu-memory"><span class="nav-index">05</span>CPU &amp; memory</button>
        <button class="nav-item" data-view="commands"><span class="nav-index">06</span>Ubuntu commands</button>
        <div class="nav-caption nav-caption-spaced">OS LAB</div>
        <button class="nav-item" data-view="concepts"><span class="nav-index">07</span>OS concepts</button>
        <button class="nav-item" data-view="ipc"><span class="nav-index">08</span>IPC demonstrations</button>
        <button class="nav-item" data-view="memory"><span class="nav-index">09</span>Memory demonstrations</button>
        <button class="nav-item" data-view="files"><span class="nav-index">10</span>File I/O</button>
        <button class="nav-item" data-view="threads"><span class="nav-index">11</span>Threads &amp; sync</button>
        <button class="nav-item" data-view="co-mapping"><span class="nav-index">12</span>CO mapping</button>
        <button class="nav-item" data-view="architecture"><span class="nav-index">13</span>Architecture</button>
      </nav>
      <div class="sidebar-foot">
        <span class="live-dot" id="connection-dot"></span>
        <span id="connection-label">Waiting for Linux collector</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>LINUX KERNEL MONITORING SYSTEM</span><span class="crumb-divider">/</span><strong id="view-crumb">Dashboard</strong></div>
        <div class="top-actions">
          <span class="data-mode" id="data-mode">NO LIVE DATA</span>
          <button class="button button-quiet" id="capture-button" title="Save this live snapshot in this browser">Capture snapshot</button>
          <button class="button button-quiet" id="export-csv-button" title="Download current process data as CSV">Export CSV</button>
          <button class="button button-primary" id="export-json-button" title="Download the current Linux snapshot as JSON">Export JSON</button>
        </div>
      </header>
      <section class="page" id="page" aria-live="polite"></section>
      <footer class="page-footer"><span>LOCAL SYSTEM DATA</span><span id="updated-at">No collector snapshot received</span></footer>
    </main>
  </div>
</body>
</html>
